name: MoonCite CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          "$HOME/.moon/bin/moon" version --all
          moonc -v
          moonc_version="$(moonc -v | sed -E 's/^v([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
          test "$(printf '%s\n' 0.10.14 "$moonc_version" | sort -V | head -n1)" = "0.10.14"
      - name: Format
        run: moon fmt --check
      - name: Check wasm-gc
        run: moon check --target wasm-gc --deny-warn
      - name: Check wasm
        run: moon check --target wasm --deny-warn
      - name: Check js
        run: moon check --target js --deny-warn
      - name: Check native
        run: moon check --target native --deny-warn
      - name: Test wasm-gc
        run: moon test --target wasm-gc

